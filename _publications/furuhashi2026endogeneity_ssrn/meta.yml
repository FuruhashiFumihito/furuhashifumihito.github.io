# =============================================================================
#  furuhashi2026endogeneity_ssrn / meta.yml
# =============================================================================
#
#  論文: Endogeneity in Vehicle Trajectory Prediction through Game-Informed
#        Deep Learning (Furuhashi & Hato, 2026)
#        SSRN プレプリント (現在の publications.bib エントリ).
#        将来 Transportation Research Part C の正式掲載版が出た段階で
#        BibTeX エントリのキーを差し替えるなら、このフォルダも一緒に
#        リネームする運用を想定。
#
#  このファイルは _plugins/bibtex_publications.rb によってビルド時に読み込まれ、
#  /projects/furuhashi2026endogeneity_ssrn/ の仮想ページに merge される。
#
#  `src:` は同フォルダ内の画像ファイルを指す相対パスで書ける
#  (プラグインが /projects/<key>/ に解決する)。絶対パス (/で始まる) や
#  外部 URL はそのまま使われる。
#
#  使えるフィールド:
#
#    graphical_abstract:
#      src:     画像パス (同フォルダのファイル名でよい)
#      alt:     代替テキスト (日英共通)
#      alt_ja:  代替テキスト (日本語ページ用)
#      alt_en:  代替テキスト (英語ページ用)
#
#    figures:
#      - src:         画像パス
#        alt / alt_ja / alt_en:             代替テキスト
#        caption / caption_ja / caption_en: キャプション
#
#  論文本文 (Notes セクション) は同フォルダの body_ja.md / body_en.md
#  に書くと自動的に注入される。
# =============================================================================

graphical_abstract:
  src: graphical_abstract.png
  alt_ja: "Game-Informed Deep Learning (GIDL) のグラフィカル・アブストラクト: 車両軌道予測における内生性問題を、微分ゲームに基づく均衡構造を深層学習モデルに埋め込むことで解消する枠組みの概要図"
  alt_en: "Graphical abstract of Game-Informed Deep Learning (GIDL): a framework that resolves endogeneity in vehicle trajectory prediction by embedding differential-game equilibrium structure into a deep learning model"

